# Build signed release APKs on push/merge to main.
# Requires GitHub secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# To create KEYSTORE_BASE64: base64 -w 0 your-release.keystore | pbcopy (mac) or base64 your-release.keystore (linux)
#
# Builds both distribution flavors (see app/build.gradle.kts) with the same key.
# dependenciesInfo is off for every build, not just fdroid (android {} block, both flavors):
#   - github: today's behaviour, yt-dlp self-update on -> BabakCast.apk
#   - fdroid: yt-dlp self-update off -> BabakCast-fdroid.apk

name: Build signed release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # create release and upload APKs

# Serialize rather than cancel: two concurrent runs would read the same version from
# gradle.properties and both try to release it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # shallow clones hide tags, and the already-released check needs them

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Read the version
        id: version
        run: |
          # gradle.properties is the only place the version is set; F-Droid's checkupdates
          # reads the same lines at each tag. Refuse to re-release a version, so a
          # forgotten bump fails here instead of overwriting nothing and confusing later.
          # An ordinary push to main is not a bump signal on its own though -- most merges
          # don't touch the version -- so a push run that finds the tag already there just
          # skips the release and stays green; only a manual dispatch treats that as an error.
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cannot parse VERSION_NAME: '$VERSION'" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::notice::v$VERSION is already released; nothing to do on an ordinary merge."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "v$VERSION is already released. Bump VERSION_NAME and VERSION_CODE in gradle.properties first." >&2
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets
        if: steps.version.outputs.skip != 'true'
        run: |
          missing=0
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing or empty secret: KEYSTORE_BASE64"; missing=1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "Missing or empty secret: KEYSTORE_PASSWORD"; missing=1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "Missing or empty secret: KEY_ALIAS"; missing=1; fi
          if [ -z "$KEY_PASSWORD" ]; then echo "Missing or empty secret: KEY_PASSWORD"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Decode keystore
        if: steps.version.outputs.skip != 'true'
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

      - name: Build signed release APKs (github + fdroid)
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew assembleGithubRelease assembleFdroidRelease --no-daemon --no-configuration-cache

      - name: Copy APKs with fixed names for stable download URLs
        if: steps.version.outputs.skip != 'true'
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk BabakCast.apk
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk BabakCast-fdroid.apk

      - name: Locate apksigner
        if: steps.version.outputs.skip != 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found under ANDROID_HOME/build-tools"; exit 1; fi
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Verify APK signatures
        if: steps.version.outputs.skip != 'true'
        run: |
          "$APKSIGNER" verify --print-certs BabakCast.apk
          "$APKSIGNER" verify --print-certs BabakCast-fdroid.apk

      - name: Upload APK artifacts
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed
          path: |
            BabakCast.apk
            BabakCast-fdroid.apk

      # target_commitish pins the tag to the commit this run actually built. Without it
      # the tag lands on whatever main points at when the API call runs, which is not
      # necessarily the same commit once a large build has had time to be overtaken by
      # a later push.
      - name: Create GitHub Release and upload APKs
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            BabakCast.apk
            BabakCast-fdroid.apk
          draft: false
          generate_release_notes: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
